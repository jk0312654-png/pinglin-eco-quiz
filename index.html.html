<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#176b55">
<title>坪林國小 生態科學闖關</title>
<style>
:root{--green:#176b55;--mint:#e8f5ee;--yellow:#ffd66b;--ink:#20352e;--muted:#64756e;--white:#fff;--red:#c94b4b}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;color:var(--ink);background:linear-gradient(135deg,#eaf7ee,#fff8df);display:flex;align-items:center;justify-content:center;padding:18px}
.app{width:min(100%,980px);min-height:min(760px, calc(100vh - 36px));background:#ffffffed;border:4px solid #d7eadb;border-radius:30px;box-shadow:0 16px 40px #234b3520;padding:clamp(18px,4vw,42px);display:flex;flex-direction:column;position:relative;overflow:hidden}
.topline{display:flex;justify-content:space-between;align-items:center;gap:12px;color:var(--green);font-weight:800;font-size:clamp(14px,2vw,18px)}
.pill{background:var(--mint);padding:9px 16px;border-radius:999px}
.screen{display:none;flex:1;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:22px;padding:24px 0}
.screen.active{display:flex}
h1{font-size:clamp(32px,6vw,58px);line-height:1.25;color:var(--green);margin:8px 0}
h2{font-size:clamp(27px,4.5vw,42px);line-height:1.35;margin:0;color:var(--green)}
.subtitle{font-size:clamp(18px,2.6vw,25px);line-height:1.7;color:var(--muted);max-width:760px;margin:0}
.notice{background:#fff5d7;border:2px solid #f4d47a;border-radius:20px;padding:18px 24px;font-size:clamp(17px,2.4vw,23px);line-height:1.7;max-width:760px;width:100%}
.bigbtn{border:0;border-radius:18px;background:var(--green);color:white;font-size:clamp(22px,3vw,30px);font-weight:900;padding:17px 54px;min-height:68px;box-shadow:0 6px 0 #0e4d3c;cursor:pointer;touch-action:manipulation}
.bigbtn:active{transform:translateY(3px);box-shadow:0 3px 0 #0e4d3c}
.question{font-size:clamp(23px,3.4vw,34px);font-weight:850;line-height:1.55;max-width:850px;margin:8px auto}
.answers{display:grid;grid-template-columns:1fr 1fr;gap:18px;width:100%;max-width:820px;margin-top:8px}
.answer{background:#f4faf5;border:3px solid #b9d9c4;border-radius:22px;min-height:116px;padding:18px 22px;font-size:clamp(19px,2.7vw,27px);font-weight:750;color:#234b3c;cursor:pointer;touch-action:manipulation;line-height:1.45;display:flex;align-items:center;justify-content:center;gap:12px}
.answer .letter{background:#dcefe2;border-radius:50%;width:42px;height:42px;min-width:42px;display:grid;place-items:center;color:var(--green);font-weight:900}
.answer:active{transform:scale(.985)}
.answer.selected{border-color:var(--green);background:#dff2e5}
.answer.correct{border-color:#23834e;background:#dff5e6}
.answer.wrong{border-color:#c94b4b;background:#ffeded}
.answer:disabled{cursor:default}
.feedback{font-size:clamp(18px,2.5vw,24px);font-weight:800;min-height:34px}
.nextbtn{font-size:21px;padding:14px 38px;min-height:58px}
.progress{height:12px;background:#e5eee7;border-radius:99px;overflow:hidden;width:min(100%,700px)}
.progress>div,.progressFill{display:block;height:100%;background:#edbd45;width:0%;transition:width .25s}
.resultmark{font-size:clamp(76px,13vw,130px);line-height:1}
.resulttext{font-size:clamp(34px,6vw,58px);font-weight:950}
.pass{color:#19834d}.fail{color:#c94b4b}
.score{font-size:clamp(22px,3vw,30px);font-weight:800}
.small{font-size:15px;color:var(--muted)}
@media(max-width:620px){body{padding:8px}.app{min-height:calc(100vh - 16px);border-radius:22px;padding:18px 15px}.answers{grid-template-columns:1fr;gap:12px}.answer{min-height:82px;padding:14px 16px}.screen{gap:17px;padding:12px 0}.notice{padding:14px 16px}}
</style>
</head>
<body>
<main class="app">
  <div class="topline"><span>🌿 坪林國小・生態科學闖關</span><span class="pill" id="topStatus">準備開始</span></div>

  <section class="screen active" id="page1">
    <div style="font-size:clamp(60px,10vw,100px)">🦉🌳🐸</div>
    <h1>坪林國小<br>生態科學闖關</h1>
    <p class="subtitle">一起探索校園、認識動植物，挑戰你的生態小知識！</p>
    <div class="notice">
      <strong>闖關規則</strong><br>
      每回合會從 20 題題庫中隨機抽出 3 題。<br>
      每題只有 A、B 兩個選項。<br>
      <strong>答對 2 題或 3 題就能過關！</strong><br>
      答對 1 題或 0 題則不過關。
    </div>
    <button class="bigbtn" id="startBtn">開始闖關 ▶</button>
    <div class="small">準備好了嗎？加油！</div>
  </section>

  <section class="screen" id="page2">
    <div class="progress"><div class="progressFill"></div></div>
    <div class="topline" style="width:100%"><span class="questionCount">第 1 題／共 3 題</span><span class="pill">答對 <b class="scoreNow">0</b> 題</span></div>
    <h2>第一道題目</h2>
    <div class="question questionText"></div>
    <div class="answers answerArea"></div>
    <div class="feedback" aria-live="polite"></div>
    <button class="bigbtn nextbtn nextBtn" hidden>下一題 ▶</button>
  </section>

  <section class="screen" id="page3">
    <div class="progress"><div class="progressFill"></div></div>
    <div class="topline" style="width:100%"><span class="questionCount">第 2 題／共 3 題</span><span class="pill">答對 <b class="scoreNow">0</b> 題</span></div>
    <h2>第二道題目</h2>
    <div class="question questionText"></div>
    <div class="answers answerArea"></div>
    <div class="feedback" aria-live="polite"></div>
    <button class="bigbtn nextbtn nextBtn" hidden>下一題 ▶</button>
  </section>

  <section class="screen" id="page4">
    <div class="progress"><div class="progressFill"></div></div>
    <div class="topline" style="width:100%"><span class="questionCount">第 3 題／共 3 題</span><span class="pill">答對 <b class="scoreNow">0</b> 題</span></div>
    <h2>第三道題目</h2>
    <div class="question questionText"></div>
    <div class="answers answerArea"></div>
    <div class="feedback" aria-live="polite"></div>
    <button class="bigbtn nextbtn nextBtn" hidden>下一題 ▶</button>
  </section>
  <section class="screen" id="page5">
    <div class="resultmark" id="resultMark">🏆</div>
    <div class="resulttext pass" id="resultTitle">過關！</div>
    <div class="score" id="resultScore"></div>
    <p class="subtitle" id="resultMessage"></p>
    <button class="bigbtn" id="againBtn">再玩一次 ↻</button>
  </section>
</main>
<script>
const bank = [
["坪林國小最早在民國 41 年創立（太平國校坪林分班）時，是借用哪裡作為第一代教室來上課的？","坪林村集會所（現在的玉林宮）","坪林森林公園",0],
["玉林宮主祀的神明是？","三府王爺（朱、李、池府千歲）","文昌帝君",0],
["在玉林宮旁邊，還有一座村民逢年過節也會去拜拜的廟宇是？","土地公廟（福德祠）","媽祖廟",0],
["葉子邊緣平平滑滑、沒有凹凹凸凸的鋸齒，稱為？","全緣","鋸齒緣",0],
["校園常見花草中，葉片揉壓後有特殊香氣、可以用來做香氣瓶的是？","左手香","大王椰子",0],
["生態池的水生植物中，葉子浮在水面上且葉片有「V 型缺口」的是？","睡蓮","荷花",0],
["完成「我的落葉拼圖」地面創作後，落葉應該怎麼處理才符合環保？","放回原處做自然堆肥","裝進塑膠袋丟掉",0],
["黑冠麻鷺在草地上覓食時，常有什麼特別的動作？","大步慢走並突然定格伸長脖子","倒立用腳打滾",0],
["麻雀在地面上移動時，主要採用什麼方式？","雙腳併攏跳躍（擬跳）","像鴨子一樣划水游泳",0],
["夜間活動的貓頭鷹鳥類，並為牠彩繪小小巢箱的是？","領角鴞","綠繡眼",0],
["昆蟲成蟲最重要的身體特徵是有幾隻腳？","6 隻腳","8 隻腳",0],
["昆蟲的身體構造主要可以分為哪三個部分？","頭、胸、腹","頭、手、腳",0],
["青蛙主要由哪一種個體發出鳴叫聲來吸引異性？","雄蛙（公蛙）","雌蛙（母蛙）",0],
["青蛙為了輔助呼吸與維持水分，皮膚通常呈現什麼狀態？","濕濕滑滑的","乾乾硬硬的",0],
["戶外活動時不小心遇到蛇類，下列哪一種做法最安全？","保持距離、不打擾並慢慢後退","拿樹枝去打牠或用手捉牠",0],
["臺灣馬口魚主要生活在什麼水域環境？","溪流／河流","深海海洋",0],
["太平區的百變城堡，這座城堡造型的建築是？","屯區藝文中心","坪林圖書館",0],
["引廍子坑溪水、建造於日治時期的古老水圳是？","太平二圳","嘉南大圳",0],
["農民從太平二圳引水到竹筍田灌溉時，大家輪流引水的傳統機制稱為？","輪水番","抽籤比賽",0],
["坪林在地美味的特產農作物，從地底挖出來、可做成美味佳餚的是？","竹筍","高麗菜",0]
];
let round=[], index=0, score=0, locked=false;
const $=id=>document.getElementById(id);
function showPage(n){
 document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
 $('page'+n).classList.add('active');
 $('topStatus').textContent = n===1?'準備開始':n===5?'闖關結果':`第 ${n-1}／3 題`;
}
function start(){
 round=[...bank].sort(()=>Math.random()-.5).slice(0,3).map(q=>{
   const correct=q[3], opts=[{text:q[1],ok:correct===0},{text:q[2],ok:correct===1}];
   if(Math.random()<.5) opts.reverse();
   return {question:q[0],opts};
 });
 index=0;score=0;renderQuestion();
}
function renderQuestion(){
 locked=false;
 const page=$('page'+(index+2));
 showPage(index+2);
 page.querySelector('.questionCount').textContent=`第 ${index+1} 題／共 3 題`;
 page.querySelector('.scoreNow').textContent=score;
 page.querySelector('.progressFill').style.width=`${index/3*100}%`;
 page.querySelector('.questionText').textContent=round[index].question;
 page.querySelector('.feedback').textContent='';
 page.querySelector('.nextBtn').hidden=true;
 const area=page.querySelector('.answerArea'); area.innerHTML='';
 round[index].opts.forEach((o,i)=>{
   const btn=document.createElement('button');btn.className='answer';
   btn.innerHTML=`<span class="letter">${i===0?'A':'B'}</span><span>${o.text}</span>`;
   btn.addEventListener('click',()=>choose(i,btn));area.appendChild(btn);
 });
}
function choose(i,button){
 if(locked)return;locked=true;
 const page=$('page'+(index+2)), q=round[index];
 const buttons=[...page.querySelectorAll('.answer')];
 buttons.forEach((b,j)=>{b.disabled=true;if(q.opts[j].ok)b.classList.add('correct');});
 const feedback=page.querySelector('.feedback');
 if(q.opts[i].ok){score++;feedback.textContent='答對了！太棒了！🎉';feedback.style.color='#19834d';}
 else{feedback.textContent='再接再厲！正確答案已標示。';feedback.style.color='#c94b4b';button.classList.add('wrong');}
 page.querySelector('.scoreNow').textContent=score;
 page.querySelector('.progressFill').style.width=`${(index+1)/3*100}%`;
 const nextBtn=page.querySelector('.nextBtn');
 nextBtn.textContent=index===2?'完成闖關 ✓':'下一題 ▶';
 nextBtn.hidden=false;
}
function next(){
 if(!locked)return;
 if(index<2){index++;renderQuestion();}
 else finish();
}
function finish(){
 const passed=score>=2;
 $('resultMark').textContent=passed?'🏆':'🌼';
 $('resultTitle').textContent=passed?'過關！':'不過關';
 $('resultTitle').className='resulttext '+(passed?'pass':'fail');
 $('resultScore').textContent=`你答對了 ${score}／3 題`;
 $('resultMessage').textContent=passed?'恭喜你成為生態小達人！繼續保持好奇心，探索校園大自然！':'沒關係！多認識校園生態，再挑戰一次，你一定會更進步！';
 showPage(5);
}
$('startBtn').addEventListener('click',start);

// 修正下一題按鈕
document.querySelectorAll('.nextBtn').forEach(btn=>{
  btn.addEventListener('click',next);
});

// 再玩一次
$('againBtn').addEventListener('click',()=>{
  index=0;
  score=0;
  locked=false;
  showPage(1);
});




</script>
</body>
</html>
